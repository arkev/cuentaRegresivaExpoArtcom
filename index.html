<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expo Artcom · Impulso Creativo</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,700,800" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: "Poppins", Helvetica, Arial, sans-serif;
            color: #fff;
            background: #3a2a8c url(https://expo.artcom.mx/wp-content/uploads/2026/11/Fondo_CR-100.jpg) center / cover no-repeat fixed;
            overflow-x: hidden;
        }

        /* ---------- Escenario ---------- */
        .stage {
            position: relative;
            min-height: 100vh;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 3vw 2vw;
            display: grid;
            grid-template-columns: 1fr minmax(0, 1.6fr) 1fr;
            grid-template-rows: auto 1fr auto;
            grid-template-areas:
                "logo-a  logo-e logo-l"
                "p-artes main   p-com"
                "p-arq   main   p-dis";
            align-items: center;
            justify-items: center;
        }

        .stage img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .logo-artcom {
            grid-area: logo-a;
            width: clamp(70px, 8vw, 130px);
            justify-self: start;
            align-self: start;
        }

        .logo-legado {
            grid-area: logo-l;
            width: clamp(40px, 4.4vw, 70px);
            justify-self: end;
            align-self: start;
        }

        .persona {
            width: 125%;
            max-width: 520px;
            z-index: 1;
        }

        .p-artes {
            margin-left: -3vw;
            grid-area: p-artes;
            align-self: start;
            justify-self: start;
        }

        .p-com {
            margin-right: -3vw;
            grid-area: p-com;
            align-self: start;
            justify-self: end;
        }

        .p-arq {
            margin-left: -3vw;
            grid-area: p-arq;
            align-self: start;
            justify-self: start;
        }

        .p-dis {
            margin-right: -3vw;
            grid-area: p-dis;
            align-self: start;
            justify-self: end;
        }

        /* ---------- Contenido central ---------- */
        .main {
            grid-area: main;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            align-self: start;
            z-index: 2;
        }

        .logo-expo {
            grid-area: logo-e;
            align-self: end;
            z-index: 2;
            width: clamp(180px, 22vw, 340px);
        }

        .logo-impulso {
            width: clamp(260px, 38vw, 620px);
        }

        #timer {
            display: flex;
            justify-content: center;
            flex-wrap: nowrap;
            gap: clamp(14px, 2.6vw, 44px);
            margin: clamp(16px, 2.4vw, 36px) 0;
            font-family: "Poppins", sans-serif;
        }

        #timer>div {
            line-height: 1;
            font-size: clamp(34px, 5.2vw, 84px);
            font-weight: 700;
            min-width: 1.6em;
        }

        #timer>div span {
            display: block;
            margin-top: .3em;
            font-size: clamp(11px, 1.15vw, 18px);
            font-weight: 400;
            color: #fff;
        }

        .horarios p {
            margin: 0 0 1.2em;
            font-size: clamp(12px, 1.2vw, 18px);
            line-height: 1.6;
            color: #fff;
        }

        .horarios p strong {
            font-weight: 700;
        }

        hr {
            height: 2px;
            width: min(300px, 70%);
            background: #fff;
            margin: 0 auto 1.2em;
            border: 0;
            opacity: .9;
        }

        .horarios h2 {
            margin: 0;
            font-size: clamp(15px, 1.7vw, 26px);
            font-weight: 700;
            letter-spacing: .02em;
        }

        body>div>div>img {
            margin-top: 30px;
        }

        body>div>img.persona.p-dis.animate__animated.animate__fadeInRight.animate__delay-1s,
        body>div>img.persona.p-arq.animate__animated.animate__fadeInLeft.animate__delay-1s {
            margin-top: -280px;
        }

        /* ---------- Tablet / móvil ---------- */
        @media (max-width: 900px) {
            body {
                background-attachment: scroll;
            }

            body>div>img.persona.p-dis.animate__animated.animate__fadeInRight.animate__delay-1s,
            body>div>img.persona.p-arq.animate__animated.animate__fadeInLeft.animate__delay-1s {
                margin-top: 0px;
            }

            .stage {
                min-height: 100vh;
                padding: 20px 14px 0;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto auto auto auto auto;
                grid-template-areas:
                    "logo-a  logo-l"
                    "logo-e  logo-e"
                    "p-artes p-com"
                    "main    main"
                    "p-arq   p-dis";
                row-gap: 6px;
            }

            .logo-artcom {
                width: 22vw;
                max-width: 100px;
            }

            .logo-legado {
                width: 11vw;
                max-width: 50px;
            }

            .persona {
                max-width: 340px;
                width: 95%;
                margin: 0;
            }

            .p-artes,
            .p-arq {
                justify-self: start;
            }

            .p-com,
            .p-dis {
                justify-self: end;
            }

            .p-artes,
            .p-com {
                align-self: end;
                margin-bottom: -8vw;
            }

            .p-arq,
            .p-dis {
                align-self: start;
                margin-top: -8vw;
            }

            .main {
                padding: 4vw 0;
            }

            .logo-expo {
                justify-self: center;
                align-self: center;
                width: clamp(150px, 42vw, 260px);
            }

            .logo-impulso {
                width: min(88vw, 520px);
            }

            #timer>div {
                font-size: clamp(34px, 11vw, 72px);
            }

            #timer>div span {
                font-size: clamp(11px, 3vw, 16px);
            }

            .horarios p {
                font-size: clamp(12px, 3.4vw, 17px);
            }

            .horarios h2 {
                font-size: clamp(16px, 4.6vw, 24px);
            }
        }

        @media (max-width: 420px) {
            #timer {
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="stage">
        <img class="logo-artcom animate__animated animate__fadeIn"
            src="https://expo.artcom.mx/wp-content/uploads/2026/11/Artcom_Logo.svg" alt="Artcom">
        <img class="logo-legado animate__animated animate__fadeIn"
            src="https://expo.artcom.mx/wp-content/uploads/2026/11/Legado_Logo.svg" alt="Legado Cultural">

        <img class="logo-expo animate__animated animate__fadeInDown"
            src="https://expo.artcom.mx/wp-content/uploads/2026/11/ExpoArtcom_Logo.svg" alt="Expo Artcom">

        <img class="persona p-artes animate__animated animate__fadeInLeft"
            src="https://expo.artcom.mx/wp-content/uploads/2026/11/Artes.png" alt="Artes">
        <img class="persona p-com animate__animated animate__fadeInRight"
            src="https://expo.artcom.mx/wp-content/uploads/2026/11/Comunicacion.png" alt="Comunicación">
        <img class="persona p-arq animate__animated animate__fadeInLeft animate__delay-1s"
            src="https://expo.artcom.mx/wp-content/uploads/2026/11/Arquitectura.png" alt="Arquitectura">
        <img class="persona p-dis animate__animated animate__fadeInRight animate__delay-1s"
            src="https://expo.artcom.mx/wp-content/uploads/2026/11/Disenio.png" alt="Diseño">

        <div class="main">
            <img class="logo-impulso animate__animated animate__zoomIn animate__delay-1s"
                src="https://expo.artcom.mx/wp-content/uploads/2026/11/ImpulsoCreativo_Logo.svg" alt="Impulso Creativo">

            <div id="timer" class="animate__animated animate__fadeInUp animate__delay-2s">
                <div id="days"></div>
                <div id="hours"></div>
                <div id="minutes"></div>
                <div id="seconds"></div>
            </div>

            <div class="horarios animate__animated animate__fadeInUp animate__delay-2s">
                <h2>26-27 DE NOVIEMBRE</h2>
                <p><strong>Jueves 26 Noviembre</strong><br>
                    7:00 PM - CEREMONIA DE INAUGURACIÓN<br>
                    PREMIACIÓN Y RECORRIDOS</p>
                <hr>
                <p><strong>Viernes 27 Noviembre</strong><br>
                    9:00 AM - RECORRIDOS<br>
                    11:30 PM - CLAUSURA Y PREMIACIÓN</p>

            </div>
        </div>
    </div>
    <script>
        (function () {
            var end = new Date("2026-11-26T18:59:59-05:00").getTime();
            var pad = function (n) { return n < 10 ? "0" + n : n; };
            function tick() {
                var t = Math.max(0, Math.floor((end - Date.now()) / 1000));
                var d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600),
                    m = Math.floor(t % 3600 / 60), s = t % 60;
                var set = function (id, v, l) { document.getElementById(id).innerHTML = v + "<span>" + l + "</span>"; };
                set("days", d, "Días"); set("hours", pad(h), "Horas");
                set("minutes", pad(m), "Minutos"); set("seconds", pad(s), "Segundos");
            }
            tick(); setInterval(tick, 1000);
        })();
    </script>
</body>

</html>
