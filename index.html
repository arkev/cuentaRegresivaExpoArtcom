<link href='https://fonts.googleapis.com/css?family=Poppins:600,400,700' rel='stylesheet' type='text/css'>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.0/jquery.min.js"></script>
<script src="https://expo.artcom.mx/wp-content/uploads/coutdownt.js"></script>
<meta name="viewport" content="width=device-width, user-scalable=no">
<style>
    html {
        height: 100%;
        min-height: 100%;
        display: block;
    }

    #myVideo {
        position: fixed;
        right: 0;
        bottom: 0;
        min-width: 100%;
        min-height: 100%;
    }

    body {
        font-family: "Poppins", Helvetica, Arial, sans-serif;
        font-size: 16px;
        height: 100%;
        min-height: 100%;
        color: white;
        padding: 0;
        margin: 0;
        position: relative;
    }

    .container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(3, auto);
        grid-column-gap: 0px;
        grid-row-gap: 0px;
        position: relative;
        bottom: 0;
        width: 100%;
        padding: 20px;
    }

    .reflejo {
        grid-row: 1/4;
        background: url(http://expo.artcom.mx/wp-content/uploads/2025/11/grupal2f.png) no-repeat;
        background-size: contain;
    }

    .reflejo img {
        width: 70%;
        margin: 30px auto;
        display: block;
    }

    .marca {
        margin: 30px auto;
        height: 100px;
    }

    p {
        color: #fff;
        font-size: 18px;
        text-align: center;
    }

    hr {
        height: 2px;
        background-color: #fff;
        width: 300px;
        margin: 0 auto;
        border: 0;
    }

    h2 {
        text-align: center;
    }

    .powered {
        position: absolute;
        bottom: 1em;
        color: #BBB;
        font-size: 0.8em;
        text-align: center;
        width: 90%;
    }

    a {
        color: #fff;
        text-decoration: none;
        -webkit-transition: color 0.1s ease-in;
        transition: color 0.1s ease-in;
    }

    a:hover {
        color: white;
    }

    @import url(https://fonts.googleapis.com/css?family=Oswald:400,700,300);

    #timer {
        width: 100%;
        font-family: 'Oswald', sans-serif;
        text-align: center;
        height: 150px;
    }

    #timer div {
        display: inline-block;
        line-height: 1;
        padding: 20px;
        font-size: 80px;
        font-weight: 700;
    }

    #timer span {
        display: block;
        font-size: 20px;
        color: white;
        font-weight: 300;
    }
</style>
<video autoplay muted loop id="myVideo">
    <source src="http://expo.artcom.mx/wp-content/uploads/2025/11/Fondo.mp4" type="video/mp4">
</video>
<div class="container">
    <div class="reflejo animate__animated animate__fadeIn">
        <img src="http://expo.artcom.mx/wp-content/uploads/2025/11/REFLEJO.svg" alt="Expo Artcom"
            class=" animate__animated animate__flipInY animate__delay-2s">
    </div>
    <img src="https://expo.artcom.mx/wp-content/uploads/2021/05/expo_artcom.svg" alt="Expo Artcom"
        class="marca animate__animated animate__fadeInRight">
    <div id="timer" class=" animate__animated animate__fadeInRight animate__delay-1s">
        <div id="days"></div>
        <div id="hours"></div>
        <div id="minutes"></div>
        <div id="seconds"></div>
    </div>
    <div class="horarios animate__animated animate__fadeInRight animate__delay-2s">
        <p><strong>Jueves 27 Noviembre</strong><br>
            7:00 PM - CEREMONIA DE INAGURACIÓN<br>
            PREMIACIÓN Y RECORRIDOS</p>
        <hr>
        <p><strong>Viernes 28 Noviembre</strong><br>
            9:00 AM - RECORRIDOS<br>
            12:00 PM - CLAUSURA Y PREMIACIÓN</p>
        <h2>27-28 DE NOVIEMBRE</h2>
    </div>
</div>
